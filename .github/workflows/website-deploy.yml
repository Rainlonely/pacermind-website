name: Deploy website to Alibaba Cloud

on:
  push:
    branches: [codex/pacermind-3-atlas-editor-review-20261008]

permissions:
  contents: read

# Never interrupt a running atomic release. New pushes replace pending work.
concurrency:
  group: pacermind-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and publish static website
    if: github.repository == 'Rainlonely/pacermind-website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install isolated check dependencies
        run: |
          python -m pip install jsonschema==4.26.0
          npm install --prefix "$RUNNER_TEMP/pacermind-ci" --no-audit --no-fund playwright@1.57.0
          # The regional Azure mirror can stall font/library downloads for minutes.
          # Keep Ubuntu signature checks and package selections; use its main mirror.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' /etc/apt/apt-mirrors.txt
          fi
          "$RUNNER_TEMP/pacermind-ci/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate website, plans and deployment safety
        run: |
          for source in scripts/*.js scripts/*.mjs scripts/tests/*.cjs; do node --check "$source"; done
          node --test scripts/tests/plan-core.test.mjs scripts/tests/journey-calendar.test.cjs
          python scripts/tests/check-site.py
          python scripts/tests/check-plan-contract.py
          python deploy/test_receive.py
          python scripts/tests/test-journey-publish.py
          python scripts/tests/test-journey-calendar-assets.py
          git diff --check
      - name: Check browser behavior
        env:
          PACERMIND_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pacermind-ci/node_modules/playwright
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/pacermind-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Preview did not start')
          PY
          node scripts/tests/browser-tests.cjs
          node scripts/tests/journey-calendar-browser.cjs
          node scripts/tests/form-controls.cjs
      - name: Skip obsolete pushes
        id: latest
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          latest_sha=$(git ls-remote origin "refs/heads/$DEPLOY_BRANCH" | cut -f1)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer push exists; this run will not publish.'
          fi
      - name: Package committed public files
        if: steps.latest.outputs.publish == 'true'
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          python deploy/package.py --output "$RUNNER_TEMP/website.tar.gz" \
            --branch "$DEPLOY_BRANCH" --run-number "$GITHUB_RUN_NUMBER"
      - name: Publish through a restricted SSH receiver
        if: steps.latest.outputs.publish == 'true'
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          WEBSITE_KNOWN_HOSTS: ${{ secrets.WEBSITE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/pacermind-deploy-key"
          hosts_path="$RUNNER_TEMP/pacermind-known-hosts"
          trap 'rm -f "$key_path" "$hosts_path"' EXIT
          printf '%s\n' "$WEBSITE_DEPLOY_KEY" > "$key_path"
          printf '%s\n' "$WEBSITE_KNOWN_HOSTS" > "$hosts_path"
          ssh -T -p 2222 -i "$key_path" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_path" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            pacermind-web-deploy@101.132.63.172 deploy < "$RUNNER_TEMP/website.tar.gz"
      - name: Verify public HTTPS revision
        if: steps.latest.outputs.publish == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            https://pacermind.xyz/deployment.json -o "$RUNNER_TEMP/live-deployment.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker = json.loads((Path(os.environ['RUNNER_TEMP']) / 'live-deployment.json').read_text())
          assert marker['revision'] == os.environ['GITHUB_SHA'], 'Public site revision mismatch'
          print('Verified live revision:', marker['revision'])
          PY
