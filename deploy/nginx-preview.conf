# Private preview only. Access through an SSH tunnel until website ICP filing
# is complete. Do not replace any existing virtual host or listen on 0.0.0.0.
server {
    listen 127.0.0.1:4180;
    server_name localhost pacermind.xyz www.pacermind.xyz;

    root /var/www/pacermind-website/current;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/pacermind-website-preview.access.log;
    error_log /var/log/nginx/pacermind-website-preview.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Assets retain their original filenames, so revalidate on every visit.
    add_header Cache-Control "no-cache" always;

    location ~ /\. {
        deny all;
    }

    # Ubuntu's default mime.types may omit .mjs. Browsers require a JavaScript
    # MIME type for the planner and notes ES modules.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
