# Dedicated static-site hosts. Existing application virtual hosts stay intact.
server {
    listen 80;
    listen [::]:80;
    server_name pacermind.xyz www.pacermind.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pacermind-website/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pacermind.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.pacermind.xyz;

    ssl_certificate /etc/letsencrypt/live/pacermind.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pacermind.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pacermind.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pacermind.xyz;

    ssl_certificate /etc/letsencrypt/live/pacermind.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pacermind.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pacermind-website/current;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/pacermind-website.access.log;
    error_log /var/log/nginx/pacermind-website.error.log;

    add_header X-Content-Type-Options nosniff always;
    # Filenames are not content-hashed: revalidate rather than serving stale UI.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    location ~ /\. {
        deny all;
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
