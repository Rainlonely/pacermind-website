# Separate deployment-only listener. The existing port 22 daemon is unchanged.
Port 2222
AddressFamily inet
ListenAddress 0.0.0.0
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile /run/pacermind-website-deploy/sshd.pid
AuthorizedKeysFile /var/lib/pacermind-web-deploy/.ssh/authorized_keys

AllowUsers pacermind-web-deploy
PermitRootLogin no
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Keep receiver children inside this service's CPU/memory cgroup. The dedicated
# account has an unusable '*' password hash; only its public key can log in.
UsePAM no
StrictModes yes
UseDNS no

PermitTTY no
PermitUserRC no
PermitUserEnvironment no
DisableForwarding yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
ForceCommand /usr/bin/nice -n 10 /usr/bin/ionice -c 3 /usr/bin/python3 /usr/local/lib/pacermind-website/receive.py

LoginGraceTime 20
MaxAuthTries 3
MaxSessions 1
MaxStartups 2:30:6
ClientAliveInterval 15
ClientAliveCountMax 3
LogLevel VERBOSE
